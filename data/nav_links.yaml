# 网站导航弹窗数据
# 用法：
#   - 点击导航栏「导航」菜单弹出
#   - 按 categories 分组，每组下若干 links
#   - icon 可选：brands/<名>（品牌图标，如 brands/github）、hero/<名>（通用图标）、emoji/<名>（表情，如 emoji/rocket）
#   - 新增分组或链接后，hugo 会自动渲染到弹窗中

